server:
  port: 8080

spring:
  application:
    name: spectraledger-ledger
  datasource:
    # H2 in FILE mode: zero setup, survives restarts (data lives in ./data).
    # To move to PostgreSQL later this is a CONFIG change, not a rewrite: replace url/driver/username/password,
    # swap the h2 dependency for org.postgresql:postgresql in pom.xml. JPA entities and SQL-free repositories stay as-is.
    url: jdbc:h2:file:./data/spectraledger;LOCK_TIMEOUT=10000
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    property-naming-strategy: SNAKE_CASE   # API speaks snake_case, exactly like the AI engine's TradeExecutedEvent
    default-property-inclusion: always

spectraledger:
  # Shared secret the AI engine sends in the X-Webhook-Secret header. Override with env SPECTRALEDGER_WEBHOOK_SECRET.
  webhook-secret: ${SPECTRALEDGER_WEBHOOK_SECRET:spectraledger-demo-secret}
  # Mirrors PLATFORM_FEE_RATE in ai-engine/config.py (2%). Ledger is the source of truth once settled.
  platform-fee-rate: ${SPECTRALEDGER_FEE_RATE:0.02}
  # Every slice account is auto-provisioned with this opening balance the first time it appears in a trade.
  initial-slice-balance: ${SPECTRALEDGER_INITIAL_BALANCE:100000.0000}
  # Which browser origins may call the API. "*" is fine for a demo (frontend can be file:// or any port);
  # tighten to e.g. http://localhost:5500 for anything real.
  cors-allowed-origin-patterns: ${SPECTRALEDGER_CORS:*}
